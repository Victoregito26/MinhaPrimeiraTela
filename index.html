<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login Vortex</title>
    <link rel="stylesheet" href="CSS/index.css">
</head>
<body>
    <!-- corpo do site -->
     <!-- DIV organiza o conteúdo do nosso formulaário- HTML -->
    <div id="login">
        <div class="caixa">
            <img src="IMG/minha_logo_512.png" alt="logo">
            
            <h1 style="color: #2b8eff;">Bem vindo ao Vortex</h1>
    
            <!-- Tgas de formulário -->

            <div class="email">
                <input type="email" placeholder="Login">
            </div>

            <div class="senha">
                <input type="password" placeholder="Senha">
            </div>

            <div class="botoes">

                <div class="entrar">
                    <input type="submit" value="Entrar">
                </div>

                <div class="esqueci-senha">
                    <p><a herf="#"><b>Esqueci minha senha</b></a></p>
                </div>
                
            </div>

            <div class="recuperacao-senha">
                <p>Não tem uma conta? <a href="#"><span>Cadastre-se</span></a>
            </div>
               
                          
              
            </div>    
        </div>
    </div>
</body>

</html>
